name: Release

# Publishes a downloadable Windows build whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  # Allows building a draft artifact manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release

      - name: Package release ZIP
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keeboy-windows-x64
          path: dist/*.zip

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
