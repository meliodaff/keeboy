[package]
name = "keeboy"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
rodio = { version = "0.20", default-features = false, features = ["wav"] }
hound = "3.5"
fastrand = "2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi"
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
